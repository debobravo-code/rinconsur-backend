
spring.application.name=rinconsur-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rinconsur_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Configuracion de carga de fotografias
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Directorio de almacenamiento de fotografias
app.upload.dir=${UPLOAD_DIR:uploads/reportes}
